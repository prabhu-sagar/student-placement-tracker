<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Schedule Drive </title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:"Poppins",sans-serif;}
body{
    font-family: "Poppins", sans-serif;
    overflow-x: hidden;
    position: relative;
}

/* Animated gradient background */
body::before {
    content: "";
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(45deg, #6366f1, #60a5fa, #a78bfa, #f472b6);
    background-size: 400% 400%;
    animation: gradientBG 60s ease infinite; /* slower for smoothness */
    z-index: -1;
}
@keyframes gradientBG {0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; }}

/* Layout */
.layout{display:flex; min-height:100vh;}
.sidebar{
    width:260px;
    background: linear-gradient(180deg, #3b82f6, #1e40af);
    color:white;
    min-height:100vh;
    padding:25px 18px;
    box-shadow: 4px 0 15px rgba(0,0,0,0.1);
}
.brand{text-align:center;margin-bottom:30px;font-size:22px;font-weight:600;}
.sidebar ul{list-style:none;}
.sidebar li{padding:12px;margin-bottom:12px;border-radius:10px;cursor:pointer;transition:0.3s;}
.sidebar li:hover,.active{background:rgba(255,255,255,0.2);}

/* Main */
.main{flex:1;padding:30px 40px;background: rgba(255,255,255,0.85);border-radius:20px;margin:20px;box-shadow:0 15px 40px rgba(0,0,0,0.1);}

/* Topbar */
.topbar{display:flex;justify-content:flex-end;align-items:center;margin-bottom:20px;gap:12px;}
.topbar span{font-weight:500;color:#1e3a8a;}
.logout{background:#ef4444;color:white;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;transition:0.3s;}
.logout:hover{background:#b91c1c;}
.logout i{margin-right:5px;}

/* Cards */
.card{background: rgba(255, 255, 255, 0.9);backdrop-filter: blur(10px);border-radius:12px;margin:15px 0;padding:20px;box-shadow:0 10px 18px rgba(0,0,0,0.08);transition: transform 0.3s, box-shadow 0.3s;}
.card:hover{transform: translateY(-5px) scale(1.02);box-shadow:0 20px 30px rgba(0,0,0,0.12);}

/* Grid for form */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;}
input, select{padding:10px;border-radius:8px;border:1px solid #cbd5e1;}
.btn{margin-top:15px;padding:12px;background:#2563eb;color:white;border:none;border-radius:8px;cursor:pointer;transition:0.3s;}
.btn:hover{background:#1e40af;}

/* Table */
table{width:100%;border-collapse:collapse;border-radius:12px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,0.08);}
th,td{text-align:left;padding:12px;}
thead{background: rgba(99,102,241,0.2); font-weight:600;}
tbody tr{border-bottom:1px solid #eee;}
tbody tr:hover{background: rgba(99,102,241,0.05);}
</style>
</head>

<body>
<div class="layout">

<!-- Sidebar -->
<aside class="sidebar">
    <h2 class="brand">Coordinator Dashboard</h2>
    <ul>
        <li onclick="location.href='coordinator_dashboard.html'"><i class="fa fa-home"></i> Dashboard</li>
        <li class="active"><i class="fa fa-calendar"></i> Schedule Drives</li>
        <li onclick="location.href='verify_eligibility.html'"><i class="fa fa-check-circle"></i> Verify Eligibility</li>
        <li onclick="location.href='update_results.html'"><i class="fa fa-bullhorn"></i> Update Results</li>
        
    </ul>
</aside>

<!-- Main -->
<main class="main">
<div class="topbar">
    <span>Coordinator</span>
    <button class="logout"><i class="fa fa-power-off"></i> Logout</button>
</div>

<h1>Schedule a New Drive</h1>

<div class="card">
<form id="driveForm">
<div class="grid">
<div>
<label>Company</label>
<select id="company" required></select>
</div>
<div>
<label>Role</label>
<input type="text" id="role" required>
</div>
<div>
<label>Date</label>
<input type="date" id="date" required>
</div>
<div>
<label>Package</label>
<input type="text" id="package" required>
</div>
<div>
<label>Minimum CGPA</label>
<input type="number" step="0.1" id="minCgpa" required>
</div>
</div>
<button class="btn">Schedule</button>
</form>
</div>

<h2>Scheduled Drives</h2>

<div class="card">
<table id="driveTable">
<thead>
<tr>
<th>Company</th>
<th>Role</th>
<th>Date</th>
<th>Package</th>
<th>Min CGPA</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>
</main>
</div>

<script>
// ================= LOGIN CHECK =================
window.onload = function () {

    const isLoggedIn =
        localStorage.getItem("isCoordinatorLoggedIn") === "true" ||
        sessionStorage.getItem("isCoordinatorLoggedIn") === "true";

    if (!isLoggedIn) {
        alert("Please login first!");
        window.location.href = "placement_coordinator_login.html";
        return;
    }

    loadCompanies();
    loadDrives();
};

// ================= LOGOUT =================
document.querySelector(".logout").addEventListener("click", function () {
    localStorage.removeItem("isCoordinatorLoggedIn");
    sessionStorage.removeItem("isCoordinatorLoggedIn");
    window.location.href = "placement_coordinator_login.html";
});

// ================= LOAD COMPANIES =================
function loadCompanies() {
    const companies = JSON.parse(localStorage.getItem("companies")) || [];
    const select = document.getElementById("company");

    select.innerHTML = "<option value=''>Select Company</option>";

    companies.forEach(c => {
        const option = document.createElement("option");
        option.value = c.name;
        option.textContent = c.name;
        select.appendChild(option);
    });
}

// ================= LOAD DRIVES =================
const tbody = document.querySelector("#driveTable tbody");

function loadDrives() {
    const drives = JSON.parse(localStorage.getItem("drives")) || [];
    tbody.innerHTML = "";

    drives.forEach(d => {
        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${d.company}</td>
            <td>${d.role}</td>
            <td>${d.date}</td>
            <td>${d.package}</td>
            <td>${d.minCgpa}</td>
        `;
        tbody.appendChild(row);
    });
}

// ================= ADD DRIVE =================
document.getElementById("driveForm").addEventListener("submit", function (e) {
    e.preventDefault();

    const company = document.getElementById("company").value;
    const role = document.getElementById("role").value;
    const date = document.getElementById("date").value;
    const pack = document.getElementById("package").value;
    const minCgpa = document.getElementById("minCgpa").value;

    const drives = JSON.parse(localStorage.getItem("drives")) || [];

    drives.push({
        company,
        role,
        date,
        package: pack,
        minCgpa
    });

    localStorage.setItem("drives", JSON.stringify(drives));

    alert("Drive Scheduled ✅");

    loadDrives();
    document.getElementById("driveForm").reset();
});
</script>

</body>
</html>
