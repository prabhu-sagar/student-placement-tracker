<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Verify Eligibility</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

*{margin:0;padding:0;box-sizing:border-box;font-family:"Poppins",sans-serif;}
body{overflow-x:hidden;position:relative;}

body::before{
content:"";
position:fixed;
top:-50%;left:-50%;
width:200%;height:200%;
background:linear-gradient(45deg,#6366f1,#60a5fa,#a78bfa,#f472b6);
background-size:400% 400%;
animation:gradientBG 15s ease infinite;
z-index:-1;
}
@keyframes gradientBG{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.layout{display:flex;}

/* Sidebar */
.sidebar{
width:260px;
background:linear-gradient(180deg,#3b82f6,#1e40af);
color:white;
min-height:100vh;
padding:25px 18px;
}
.brand{text-align:center;margin-bottom:30px;font-size:22px;font-weight:600;}
.sidebar ul{list-style:none;}
.sidebar li{padding:12px;margin-bottom:12px;border-radius:10px;cursor:pointer;}
.sidebar li:hover,.active{background:rgba(255,255,255,0.2);}

/* Main */
.main{
flex:1;
padding:30px 40px;
background:rgba(255,255,255,0.95);
border-radius:20px;
margin:20px;
box-shadow:0 15px 40px rgba(0,0,0,0.1);
position: relative;
}

/* Top-right logout button */
.top-right {
    position: absolute;
    top:20px;
    right:30px;
}
.top-right button {
    background: #ef4444; /* Red color */
    padding:8px 16px;
    border-radius:8px;
    color:white;
    border:none;
    cursor:pointer;
    font-weight:bold;
    display:flex;
    align-items:center;
    gap:6px;
}
.top-right button:hover {
    background: #dc2626;
}

.card{
background:white;
border-radius:12px;
margin:15px 0;
padding:20px;
box-shadow:0 10px 18px rgba(0,0,0,0.08);
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

input,select{
padding:10px;
border-radius:8px;
border:1px solid #cbd5e1;
}

.btn{
margin-top:15px;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}
.btn:hover{background:#1e40af;}

.result{margin-top:10px;font-weight:600;}

table{
width:100%;
border-collapse:collapse;
}
th,td{padding:12px;text-align:left;}
thead{background:#eef2ff;}
tbody tr{border-bottom:1px solid #eee;}
</style>
</head>

<body>
<div class="layout">

<!-- Sidebar -->
<aside class="sidebar">
<h2 class="brand">Placement Portal</h2>
<ul>
<li onclick="location.href='coordinator_dashboard.html'">
<i class="fa fa-home"></i> Dashboard
</li>
<li onclick="location.href='Schedule_drives.html'">
<i class="fa fa-calendar"></i> Schedule Drive
</li>
<li class="active">
<i class="fa fa-check"></i> Verify Eligibility
</li>
<li onclick="location.href='update_results.html'">
<i class="fa fa-bullhorn"></i> Update Results
</li>
</ul>
</aside>

<!-- Main -->
<main class="main">

<!-- Logout Button -->
<div class="top-right">
    <button onclick="logout()">Logout <i class="fas fa-sign-out-alt"></i></button>
</div>

<h1>Verify Student Eligibility</h1>

<div class="card">
<div class="grid">

<div>
<label>Select Drive</label>
<select id="driveSelect" onchange="loadAppliedStudents()"></select>
</div>

<div>
<label>Select Applied Student</label>
<select id="studentSelect" onchange="autoFillCgpa()"></select>
</div>

<div style="grid-column:span 2;">
<label>Student CGPA</label>
<input type="number" id="cgpa" readonly>
</div>

</div>

<button class="btn" onclick="checkEligibility()">Verify & Save</button>
<div id="result" class="result"></div>
</div>

<h2>Eligibility History</h2>
<div class="card">
<table>
<thead>
<tr>
<th>Student</th>
<th>Company</th>
<th>Role</th>
<th>CGPA</th>
<th>Status</th>
</tr>
</thead>
<tbody id="historyTable"></tbody>
</table>
</div>

</main>
</div>

<script>

// Load Data
const drives = JSON.parse(localStorage.getItem("drives")) || [];
const appliedDrives = JSON.parse(localStorage.getItem("appliedDrives")) || [];

const driveSelect = document.getElementById("driveSelect");
const studentSelect = document.getElementById("studentSelect");
const cgpaInput = document.getElementById("cgpa");

// Populate Drives
drives.forEach((d,i)=>{
let option=document.createElement("option");
option.value=i;
option.text=`${d.company} - ${d.role}`;
driveSelect.appendChild(option);
});

loadAppliedStudents();

// Load students for selected drive
function loadAppliedStudents(){

studentSelect.innerHTML="";
cgpaInput.value="";

const drive = drives[driveSelect.value];

const filtered = appliedDrives.filter(a =>
a.company===drive.company && a.role===drive.role
);

if(filtered.length===0){
studentSelect.innerHTML="<option>No Applicants</option>";
return;
}

filtered.forEach((student,i)=>{
let option=document.createElement("option");
option.value=i;
option.text=`${student.studentName} (${student.studentId})`;
studentSelect.appendChild(option);
});

autoFillCgpa();
}

// Auto fill CGPA
function autoFillCgpa(){

const drive = drives[driveSelect.value];

const filtered = appliedDrives.filter(a =>
a.company===drive.company && a.role===drive.role
);

const student = filtered[studentSelect.value];

if(student){
cgpaInput.value = student.cgpa;
}
}

// Check Eligibility
function checkEligibility(){

const drive = drives[driveSelect.value];
const minCgpa = parseFloat(drive.minCgpa);
const cgpa = parseFloat(cgpaInput.value);

if(isNaN(cgpa)){
alert("No student selected");
return;
}

let status;
const resultBox=document.getElementById("result");

if(cgpa>=minCgpa){
status="Eligible";
resultBox.style.color="green";
resultBox.innerText="✅ Eligible";
}else{
status="Not Eligible";
resultBox.style.color="red";
resultBox.innerText="❌ Not Eligible";
}

const history = JSON.parse(localStorage.getItem("eligibilityResults")) || [];

history.push({
student:studentSelect.options[studentSelect.selectedIndex].text,
company:drive.company,
role:drive.role,
cgpa:cgpa,
status:status
});

localStorage.setItem("eligibilityResults",JSON.stringify(history));

loadHistory();
}

// Load History
function loadHistory(){
const tbody=document.getElementById("historyTable");
tbody.innerHTML="";

const history = JSON.parse(localStorage.getItem("eligibilityResults")) || [];

history.forEach(h=>{
tbody.innerHTML+=`
<tr>
<td>${h.student}</td>
<td>${h.company}</td>
<td>${h.role}</td>
<td>${h.cgpa}</td>
<td>${h.status}</td>
</tr>
`;
});
}

loadHistory();

// Logout Function
function logout(){
    // Optional: clear user data
    // localStorage.clear();
    window.location.href="placement_coordinator_login.html"; // Redirect to login page
}

</script>

</body>
</html>
