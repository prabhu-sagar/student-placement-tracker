<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Available Drives</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    display:flex;
    min-height:100vh;
    background: linear-gradient(90deg,#3b82f6,#6366f1,#a855f7);
}

/* SIDEBAR */
.sidebar{
    width:260px;
    background: linear-gradient(180deg,#3b82f6,#1e40af);
    padding:30px 20px;
    color:white;
}

.sidebar h2{
    text-align:center;
    margin-bottom:35px;
}

.sidebar a{
    display:flex;
    align-items:center;
    padding:12px 14px;
    margin:10px 0;
    color:white;
    text-decoration:none;
    border-radius:10px;
    transition:0.3s;
}

.sidebar a i{
    margin-right:12px;
}

.sidebar a:hover,
.sidebar a.active{
    background:rgba(255,255,255,0.2);
}

/* MAIN */
.main{
    flex:1;
    margin:20px;
    padding:30px;
    background:#e5e7eb;
    border-radius:30px;
    box-shadow:0 10px 40px rgba(0,0,0,0.15);
}

.header{
    background:white;
    padding:25px 30px;
    border-radius:14px;
    margin-bottom:30px;
}

.card{
    background:white;
    padding:25px;
    border-radius:14px;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:14px 16px;
    text-align:left;
    font-size:14px;
}

th{
    background:#f1f3fa;
}

tr:nth-child(even){
    background:#fafbff;
}

.status{
    padding:6px 14px;
    border-radius:20px;
    font-size:13px;
}

.eligible{
    background:#d4edda;
    color:#155724;
}

.not-eligible{
    background:#f8d7da;
    color:#721c24;
}

.apply-btn{
    padding:7px 16px;
    border:none;
    background:#4e73df;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

.apply-btn:hover{
    background:#2e59d9;
}

.apply-btn:disabled{
    cursor:not-allowed;
    opacity:0.6;
}
</style>
</head>

<body>

<div class="sidebar">
    <h2>Student</h2>
    <a href="student_dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
    <a href="my_profile.html"><i class="fas fa-user"></i> My Profile</a>
    <a href="#" class="active"><i class="fas fa-briefcase"></i> Available Drives</a>
    <a href="applied_drives.html"><i class="fas fa-check-circle"></i> Applied Drives</a>
</div>

<div class="main">

    <div class="header">
        <h1>Available Placement Drives</h1>
        <p>View all ongoing placement drives and apply if you are eligible.</p>
    </div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>Company</th>
                    <th>Role</th>
                    <th>Date</th>
                    <th>Package</th>
                    <th>Min CGPA</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="drivesBody"></tbody>
        </table>
    </div>

</div>

<script>

// ===== GET LOGGED IN STUDENT =====
let student = JSON.parse(localStorage.getItem("loggedInStudent"));

if(!student){
    alert("Please login first!");
    window.location.href = "student_login.html";
}

// ✅ Use real CGPA from profile
let studentCgpa = parseFloat(student.cgpa) || 0;

// ===== FETCH DRIVES =====
let drives = JSON.parse(localStorage.getItem("drives")) || [];
const tbody = document.getElementById("drivesBody");

if(drives.length === 0){
    tbody.innerHTML = `
        <tr>
            <td colspan="7" style="text-align:center;color:#777;">
                No Drives Available
            </td>
        </tr>`;
} else {

    drives.forEach((d,index)=>{

        let eligible = studentCgpa >= parseFloat(d.minCgpa);

        tbody.innerHTML += `
        <tr>
            <td>${d.company}</td>
            <td>${d.role}</td>
            <td>${d.date}</td>
            <td>${d.package}</td>
            <td>${d.minCgpa}</td>
            <td>
                <span class="status ${eligible ? 'eligible' : 'not-eligible'}">
                    ${eligible ? 'Eligible' : 'Not Eligible'}
                </span>
            </td>
            <td>
                <button class="apply-btn"
                    ${eligible ? '' : 'disabled'}
                    onclick="applyDrive(${index})">
                    Apply
                </button>
            </td>
        </tr>`;
    });
}


// ===== UPDATED APPLY FUNCTION =====
function applyDrive(index){

    let appliedDrives = JSON.parse(localStorage.getItem("appliedDrives")) || [];
    let selectedDrive = drives[index];
    let student = JSON.parse(localStorage.getItem("loggedInStudent"));

    let alreadyApplied = appliedDrives.find(d =>
        d.company === selectedDrive.company &&
        d.role === selectedDrive.role &&
        d.studentId === student.studentId
    );

    if(alreadyApplied){
        alert("You already applied for this drive!");
        return;
    }

    appliedDrives.push({
        studentName: student.name,
        studentId: student.studentId, // ✅ FIXED
        cgpa: student.cgpa,
        company: selectedDrive.company,
        role: selectedDrive.role,
        package: selectedDrive.package,
        date: selectedDrive.date,
        status: "Pending"
    });

    localStorage.setItem("appliedDrives", JSON.stringify(appliedDrives));

    alert("Applied Successfully!");
}

</script>

</body>
</html>
