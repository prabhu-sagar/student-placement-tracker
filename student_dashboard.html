<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Dashboard</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    display:flex;
    min-height:100vh;
    background: linear-gradient(135deg,#3b82f6,#6366f1,#a855f7);
}

/* SIDEBAR */
.sidebar{
    width:260px;
    background: linear-gradient(180deg,#1e3a8a,#1e40af);
    padding:30px 20px;
    color:white;
    box-shadow:4px 0 20px rgba(0,0,0,0.2);
}

.sidebar h2{
    margin-bottom:35px;
    font-size:22px;
    text-align:center;
}

.sidebar ul{
    list-style:none;
}

.sidebar ul li{
    margin-bottom:15px;
}

.sidebar ul li a{
    text-decoration:none;
    color:white;
    padding:12px 15px;
    display:flex;
    align-items:center;
    gap:12px;
    border-radius:12px;
    transition:0.3s;
    font-size:15px;
}

.sidebar ul li a:hover{
    background:rgba(255,255,255,0.15);
    transform:translateX(5px);
}

.sidebar ul li a.active{
    background:rgba(255,255,255,0.25);
}

/* MAIN */
.main{
    flex:1;
    margin:25px;
    padding:35px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border-radius:30px;
    box-shadow:0 20px 50px rgba(0,0,0,0.2);
}

/* HEADER */
.header{
    margin-bottom:30px;
}

.header h1{
    color:white;
    font-size:28px;
}

.header p{
    color:#f1f1f1;
    margin-top:5px;
}

/* PROFILE SECTION */
.section{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.section h2{
    margin-bottom:20px;
    color:#2c4a7c;
    border-bottom:2px solid #e5e7eb;
    padding-bottom:10px;
}

.profile-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:18px;
}

.profile-card{
    background:linear-gradient(135deg,#f8fafc,#eef2ff);
    padding:15px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
    transition:0.3s;
}

.profile-card:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 20px rgba(0,0,0,0.15);
}

.profile-card strong{
    color:#3f7ad6;
}

.btn{
    padding:10px 18px;
    background:#3f7ad6;
    border:none;
    color:white;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
    font-size:14px;
}

.btn:hover{
    background:#2f6fd1;
    transform:scale(1.05);
}

/* LOGOUT BUTTON */
.logout{
    margin-top:20px;
    background:#ef4444;
}

.logout:hover{
    background:#dc2626;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>🎓 Student Panel</h2>
    <ul>
        <li><a href="#" class="active"><i class="fas fa-home"></i> Dashboard</a></li>
        <li><a href="my_profile.html"><i class="fas fa-user"></i> My Profile</a></li>
        <li><a href="available_drives.html"><i class="fas fa-calendar-alt"></i> Available Drives</a></li>
        <li><a href="applied_drives.html"><i class="fas fa-file-alt"></i> Applied Drives</a></li>
    </ul>
</div>

<!-- MAIN -->
<div class="main">

    <div class="header">
        <h1 id="welcomeText">Welcome!</h1>
        <p>Track placements, apply for drives and manage your offers.</p>
    </div>

    <!-- PROFILE -->
    <div class="section">
        <h2>My Profile</h2>

        <div class="profile-grid" id="profileData">
            <!-- Data loads dynamically -->
        </div>

        <br>
        <a href="my_profile.html">
            <button class="btn">Edit Profile</button>
        </a>

        <button class="btn logout" onclick="logout()">Logout</button>
    </div>

</div>

<script>

// Get logged in student
let student = JSON.parse(localStorage.getItem("loggedInStudent"));

if(!student){
    alert("Please login first!");
    window.location.href = "student_login.html";
}

// Welcome Message
document.getElementById("welcomeText").innerText =
    "Welcome, " + (student.name || "Student") + "!";

// Profile Data
document.getElementById("profileData").innerHTML = `
    <div class="profile-card"><strong>Name:</strong> ${student.name}</div>
    <div class="profile-card"><strong>Student ID:</strong> ${student.studentId}</div>
    <div class="profile-card"><strong>Department:</strong> ${student.department}</div>
    <div class="profile-card"><strong>Year:</strong> ${student.year}</div>
    <div class="profile-card"><strong>CGPA:</strong> ${student.cgpa}</div>
    <div class="profile-card"><strong>Email:</strong> ${student.email}</div>
    <div class="profile-card"><strong>Phone:</strong> ${student.phone}</div>
`;

// Logout
function logout(){
    localStorage.removeItem("loggedInStudent");
    window.location.href = "student_login.html";
}

</script>

</body>
</html>
