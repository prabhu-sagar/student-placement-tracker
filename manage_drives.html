<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manage Drives - Admin Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

*{margin:0;padding:0;box-sizing:border-box;font-family:"Poppins",sans-serif;}
body{overflow-x:hidden;position:relative;min-height:100vh;background:#f0f4f8;}

/* Animated background */
body::before {
    content:"";
    position:fixed; top:-50%; left:-50%;
    width:200%; height:200%;
    background: linear-gradient(45deg,#60a5fa,#93c5fd,#bfdbfe,#a5f3fc);
    background-size:400% 400%;
    animation: gradientBG 15s ease infinite;
    z-index:-1;
}
@keyframes gradientBG {
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.layout{display:flex; min-height:100vh;}
.sidebar{
    width:240px;
    background: linear-gradient(180deg,#3b82f6,#1e40af);
    color:white; padding:20px 15px;
}
.brand{text-align:center;font-size:20px;font-weight:600;margin-bottom:25px;}
.sidebar ul{list-style:none;}
.sidebar li{
    padding:10px;margin-bottom:10px;border-radius:8px;cursor:pointer;
    font-size:14px; display:flex; align-items:center; gap:10px;
}
.sidebar li:hover,.active{background:rgba(255,255,255,0.2);}

.main{
    flex:1; padding:25px 35px;
    background:rgba(255,255,255,0.9);
    border-radius:15px; margin:20px;
    box-shadow:0 12px 30px rgba(0,0,0,0.08);
}

/* Topbar */
.topbar{
    display:flex; justify-content:space-between;
    align-items:center; margin-bottom:20px;
}
.logout{
    background:#ef4444;color:white;border:none;
    padding:6px 12px;border-radius:6px;cursor:pointer;
}
.logout:hover{background:#b91c1c;}

.add-btn{
    background:#16a34a;color:white;border:none;
    padding:8px 14px;border-radius:6px;cursor:pointer;
}
.add-btn:hover{background:#15803d;}

/* Table */
.table-container{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:14px;}
th,td{border:1px solid #ccc;padding:10px;text-align:left;}
th{background:#3b82f6;color:white;}
tr:nth-child(even){background:#f3f4f6;}
button{padding:5px 10px;border:none;border-radius:5px;cursor:pointer;}
.edit-btn{background:#2563eb;color:white;}
.edit-btn:hover{background:#1e40af;}
.delete-btn{background:#ef4444;color:white;}
.delete-btn:hover{background:#b91c1c;}

/* Modal */
.modal{
    display:none; position:fixed; top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.6);
    justify-content:center; align-items:center;
}
.modal-content{
    background:white;padding:25px;border-radius:12px;width:400px;
}
.modal-content h3{margin-bottom:15px;color:#1e40af;}
.modal-content label{display:block;margin:8px 0 4px;}
.modal-content input{
    width:100%;padding:8px;border:1px solid #ccc;border-radius:5px;
}
.modal-content .save-btn{
    background:#2563eb;color:white;margin-top:12px;
}
.modal-content .cancel-btn{
    background:#ef4444;color:white;margin-top:12px;
}
</style>
</head>
<body>

<div class="layout">

<aside class="sidebar">
    <h2 class="brand">Admin Dashboard</h2>
    <ul>
        <li onclick="location.href='admin_dashboard.html'"><i class="fa fa-home"></i> Dashboard</li>
        <li onclick="location.href='manage_students.html'"><i class="fa fa-home"></i> Manage Students</li>
        <li class="active"><i class="fa fa-calendar"></i> Manage Drives</li>
        <li onclick="location.href='manage_companies.html'"><i class="fa fa-building"></i> Manage Companies</li>
        <li onclick="location.href='reports_statistics.html'"><i class="fa fa-chart-bar"></i> Reports & Statistics</li>

        
    </ul>
</aside>

<main class="main">

<div class="topbar">
    <button class="add-btn" onclick="openAddModal()">
        <i class="fa fa-plus"></i> Add Drive
    </button>
    <button class="logout" onclick="logoutAdmin()">
        <i class="fa fa-power-off"></i> Logout
    </button>
</div>

<h1 style="color:#1e3c72;">Manage Drives</h1>
<p style="color:#555;">View, add, edit or delete drives.</p>

<div class="table-container">
<table id="drivesTable">
<thead>
<tr>
<th>Company</th>
<th>Role</th>
<th>Date</th>
<th>Package</th>
<th>Min CGPA</th>

<th>Actions</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

</main>
</div>

<!-- Add/Edit Modal -->
<div class="modal" id="driveModal">
<div class="modal-content">
<h3 id="modalTitle">Add Drive</h3>

<label>Company</label>
<input type="text" id="company">

<label>Role</label>
<input type="text" id="role">

<label>Date</label>
<input type="date" id="date">

<label>Package</label>
<input type="text" id="package">

<label>Min CGPA</label>
<input type="number" step="0.1" id="minCgpa">



<button class="save-btn" onclick="saveDrive()">Save</button>
<button class="cancel-btn" onclick="closeModal()">Cancel</button>

</div>
</div>

<script>
if(localStorage.getItem("isAdminLoggedIn")!=="true"){
    window.location.href="Admin_login.html";
}

let drives = JSON.parse(localStorage.getItem("drives")) || [];
let editIndex = null;

function renderTable(){
    const tbody=document.querySelector("#drivesTable tbody");
    tbody.innerHTML="";
    drives.forEach((d,i)=>{
        tbody.innerHTML+=`
        <tr>
            <td>${d.company}</td>
            <td>${d.role}</td>
            <td>${d.date}</td>
            <td>${d.package}</td>
            <td>${d.minCgpa}</td>
            
            <td>
                <button class="edit-btn" onclick="editDrive(${i})">Edit</button>
                <button class="delete-btn" onclick="deleteDrive(${i})">Delete</button>
            </td>
        </tr>`;
    });
}

function openAddModal(){
    editIndex=null;
    document.getElementById("modalTitle").innerText="Add Drive";
    document.getElementById("driveModal").style.display="flex";
    clearForm();
}

function editDrive(index){
    editIndex=index;
    document.getElementById("modalTitle").innerText="Edit Drive";
    const d=drives[index];
    company.value=d.company;
    role.value=d.role;
    date.value=d.date;
    package.value=d.package;
    minCgpa.value=d.minCgpa;
   
    document.getElementById("driveModal").style.display="flex";
}

function saveDrive(){
    const newDrive={
        company:company.value,
        role:role.value,
        date:date.value,
        package:package.value,
        minCgpa:minCgpa.value,
        
    };

    if(editIndex===null){
        drives.push(newDrive);
    }else{
        drives[editIndex]=newDrive;
    }

    localStorage.setItem("drives",JSON.stringify(drives));
    renderTable();
    closeModal();
}

function deleteDrive(index){
    if(confirm("Delete this drive?")){
        drives.splice(index,1);
        localStorage.setItem("drives",JSON.stringify(drives));
        renderTable();
    }
}

function closeModal(){
    document.getElementById("driveModal").style.display="none";
}

function clearForm(){
    company.value="";
    role.value="";
    date.value="";
    package.value="";
    minCgpa.value="";
    coordinator.value="";
}

function logoutAdmin(){
    localStorage.removeItem("isAdminLoggedIn");
    window.location.href="Admin_login.html";
}

renderTable();
</script>

</body>
</html>
