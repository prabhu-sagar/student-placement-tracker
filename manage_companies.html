<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manage Companies - Admin Dashboard</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

/* ================= BASE ================= */
* {margin:0; padding:0; box-sizing:border-box; font-family:"Poppins",sans-serif;}
body{overflow-x:hidden; position:relative; min-height:100vh; background: #f0f4f8;}

/* ================= BACKGROUND & THEME ================= */
body::before {
    content: "";
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: linear-gradient(45deg,#60a5fa,#93c5fd,#bfdbfe,#a5f3fc);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    z-index: -1;
}
@keyframes gradientBG {0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
body::after {
    content:"";
    position: fixed;
    width:500px; height:500px;
    border-radius:50%;
    background: rgba(255,255,255,0.2);
    top:25%; left:65%;
    filter: blur(120px);
    z-index:-1;
    animation: floatCircle 20s ease-in-out infinite alternate;
}
@keyframes floatCircle {0%{transform:translateY(0px) translateX(0px);}50%{transform:translateY(-40px) translateX(20px);}100%{transform:translateY(0px) translateX(0px);}}

/* ================= LAYOUT ================= */
.layout{display:flex; min-height:100vh;}
.sidebar{
    width:240px;
    background: linear-gradient(180deg,#3b82f6,#1e40af);
    color:white;
    padding:20px 15px;
    box-shadow: 4px 0 15px rgba(0,0,0,0.1);
}
.brand{text-align:center; font-size:20px; font-weight:600; margin-bottom:25px;}
.sidebar ul{list-style:none;}
.sidebar li{padding:10px;margin-bottom:10px;border-radius:8px;cursor:pointer;transition:0.3s;font-size:14px; display:flex; align-items:center; gap:10px;}
.sidebar li:hover, .active{background: rgba(255,255,255,0.2);}

/* ================= MAIN ================= */
.main{
    flex:1;
    padding:25px 35px;
    background: rgba(255,255,255,0.85);
    border-radius:15px;
    margin:20px;
    box-shadow:0 12px 30px rgba(0,0,0,0.08);
    position: relative;
}

/* ================= TOPBAR ================= */
.topbar{
    display:flex;
    justify-content: flex-end;
    align-items:center;
    margin-bottom:15px;
    gap:10px;
    font-size:14px;
}
.logout{
    background:#ef4444;
    color:white;
    border:none;
    padding:6px 12px;
    border-radius:6px;
    cursor:pointer;
    transition:0.3s;
    font-size:13px;
}
.logout:hover{background:#b91c1c;}
.logout i{margin-right:5px;}

/* ================= TABLE ================= */
.table-container{
    overflow-x:auto;
    margin-top:20px;
}
table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
}
table th, table td{
    border:1px solid #ccc;
    padding:10px;
    text-align:left;
}
table th{
    background:#3b82f6;
    color:white;
}
table tr:nth-child(even){
    background:#f3f4f6;
}
table button{
    padding:5px 10px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:13px;
}
.edit-btn{background:#2563eb; color:white;}
.edit-btn:hover{background:#1e40af;}
.delete-btn{background:#ef4444; color:white;}
.delete-btn:hover{background:#b91c1c;}

/* ================= MODAL ================= */
.modal{
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(0,0,0,0.6);
    justify-content:center;
    align-items:center;
    z-index:10;
}
.modal-content{
    background:white;
    padding:25px;
    border-radius:12px;
    width:400px;
}
.modal-content h3{margin-bottom:15px; color:#1e40af;}
.modal-content label{display:block; margin:10px 0 5px;}
.modal-content input{width:100%; padding:8px; border:1px solid #ccc; border-radius:5px;}
.modal-content button{
    margin-top:15px;
    padding:8px 12px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
}
.modal-content .save-btn{background:#2563eb; color:white;}
.modal-content .save-btn:hover{background:#1e40af;}
.modal-content .cancel-btn{background:#ef4444; color:white;}
.modal-content .cancel-btn:hover{background:#b91c1c;}
</style>
</head>

<body>

<div class="layout">

<!-- Sidebar -->
<aside class="sidebar">
    <h2 class="brand">Admin Dashboard</h2>
    <ul>
        <li onclick="location.href='admin_dashboard.html'"><i class="fa fa-home"></i> Dashboard</li>
        <li onclick="location.href='manage_students.html'"><i class="fa fa-users"></i> Manage Students</li>
        <li class="active"><i class="fa fa-building"></i> Manage Companies</li>
        <li onclick="location.href='manage_drives.html'"><i class="fa fa-calendar"></i> Manage Drives</li>
        
        <li onclick="location.href='manage_coordinators.html'"><i class="fa fa-user-tie"></i> Manage Coordinators</li>
        <li onclick="location.href='reports_statistics.html'"><i class="fa fa-chart-bar"></i> Reports & Statistics</li>
    </ul>
</aside>

<!-- Main -->
<main class="main">
    <div class="topbar">
        <button class="logout" onclick="logoutAdmin()"><i class="fa fa-power-off"></i> Logout</button>
    </div>

    <h1 style="font-size:22px; color:#1e3c72;">Manage Companies</h1>
    <p style="font-size:14px; color:#555;">Add or edit company information for placement drives.</p>

    <button onclick="openModal()" style="padding:8px 12px; background:#2563eb; color:white; border:none; border-radius:6px; cursor:pointer; margin-top:10px;">Add New Company</button>

    <div class="table-container">
        <table id="companyTable">
            <thead>
                <tr>
                    <th>Company Name</th>
                    <th>Industry</th>
                    <th>Drive Date</th>
                    <th>Location</th>
                    <th>Contact Email</th>
                    <th>Positions</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Company rows will appear here -->
            </tbody>
        </table>
    </div>
</main>
</div>

<!-- Modal for Add/Edit -->
<div class="modal" id="companyModal">
    <div class="modal-content">
        <h3 id="modalTitle">Add Company</h3>
        <label>Company Name</label>
        <input type="text" id="companyName" required>
        <label>Industry</label>
        <input type="text" id="industry" required>
        <label>Drive Date</label>
        <input type="date" id="driveDate" required>
        <label>Location</label>
        <input type="text" id="location" required>
        <label>Contact Email</label>
        <input type="email" id="contactEmail" required>
        <label>Number of Positions</label>
        <input type="number" id="positions" required>

        <button class="save-btn" onclick="saveCompany()">Save</button>
        <button class="cancel-btn" onclick="closeModal()">Cancel</button>
    </div>
</div>

<script>
// Redirect if not logged in
window.onload = function(){
    if(localStorage.getItem("isAdminLoggedIn")!=="true"){
        window.location.href="Admin_login.html";
    }
    loadCompanies();
};

// Logout
function logoutAdmin(){
    localStorage.removeItem("isAdminLoggedIn");
    window.location.href="Admin_login.html";
}

// Modal functions
function openModal(editIndex){
    document.getElementById("companyModal").style.display = "flex";
    if(editIndex !== undefined){
        document.getElementById("modalTitle").innerText = "Edit Company";
        const company = companies[editIndex];
        document.getElementById("companyName").value = company.name;
        document.getElementById("industry").value = company.industry;
        document.getElementById("driveDate").value = company.date;
        document.getElementById("location").value = company.location;
        document.getElementById("contactEmail").value = company.email;
        document.getElementById("positions").value = company.positions;
        document.getElementById("companyModal").dataset.editIndex = editIndex;
    } else {
        document.getElementById("modalTitle").innerText = "Add Company";
        document.getElementById("companyModal").dataset.editIndex = "";
        document.getElementById("companyName").value = "";
        document.getElementById("industry").value = "";
        document.getElementById("driveDate").value = "";
        document.getElementById("location").value = "";
        document.getElementById("contactEmail").value = "";
        document.getElementById("positions").value = "";
    }
}

function closeModal(){
    document.getElementById("companyModal").style.display = "none";
}

// Load companies from localStorage or use sample data
let companies = JSON.parse(localStorage.getItem("companies")) || [
    {name:"TechSoft", industry:"IT", date:"2026-03-10", location:"Hyderabad", email:"hr@techsoft.com", positions:5},
    {name:"BuildCorp", industry:"Construction", date:"2026-03-15", location:"Bangalore", email:"contact@buildcorp.com", positions:3},
];

// Save to localStorage
function saveCompaniesToStorage(){
    localStorage.setItem("companies", JSON.stringify(companies));
}

// Render table
function renderTable(){
    const tbody = document.getElementById("companyTable").querySelector("tbody");
    tbody.innerHTML = "";
    companies.forEach((c,index)=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${c.name}</td>
            <td>${c.industry}</td>
            <td>${c.date}</td>
            <td>${c.location}</td>
            <td>${c.email}</td>
            <td>${c.positions}</td>
            <td>
                <button class="edit-btn" onclick="openModal(${index})">Edit</button>
                <button class="delete-btn" onclick="deleteCompany(${index})">Delete</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

// Save company
function saveCompany(){
    const editIndex = document.getElementById("companyModal").dataset.editIndex;
    const company = {
        name: document.getElementById("companyName").value,
        industry: document.getElementById("industry").value,
        date: document.getElementById("driveDate").value,
        location: document.getElementById("location").value,
        email: document.getElementById("contactEmail").value,
        positions: document.getElementById("positions").value
    };
    if(editIndex){
        companies[editIndex] = company;
    } else {
        companies.push(company);
    }
    saveCompaniesToStorage();
    renderTable();
    closeModal();
}

// Delete company
function deleteCompany(index){
    if(confirm("Are you sure you want to delete this company?")){
        companies.splice(index,1);
        saveCompaniesToStorage();
        renderTable();
    }
}

// Initial render
function loadCompanies(){
    renderTable();
}
</script>

</body>
</html>
