<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>
</head>
<body>

<h1>Welcome Admin 👑</h1>

<h3>Register Coordinator</h3>

<input id="name" placeholder="Name"><br><br>
<input id="email" placeholder="Email"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>

<button onclick="createCoordinator()">Create Coordinator</button>

<br><br>
<button onclick="logout()">Logout</button>

<script>

// ✅ Protect page (if not logged in, redirect)
const token = localStorage.getItem("token")
if(!token){
    alert("Please login first")
    window.location.href = "index.html"
}

// ✅ Create Coordinator
async function createCoordinator(){
    try {

        const name = document.getElementById("name").value
        const email = document.getElementById("email").value
        const password = document.getElementById("password").value

        if(!name || !email || !password){
            alert("Please fill all fields")
            return
        }

        const res = await fetch("http://localhost:5000/api/admin/create-coordinator",{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer " + token
            },
            body: JSON.stringify({ name, email, password })
        })

        const data = await res.json()

        if(res.ok){
            alert(data.message)

            // clear inputs after success
            document.getElementById("name").value = ""
            document.getElementById("email").value = ""
            document.getElementById("password").value = ""
        } else {
            alert(data.message || "Error creating coordinator")
        }

    } catch(error){
        console.error(error)
        alert("Server error")
    }
}

// ✅ Logout
function logout(){
    localStorage.removeItem("token")
    window.location.href = "index.html"
}

</script>

</body>
</html>
