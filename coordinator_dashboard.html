<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coordinator Dashboard</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins",sans-serif;
}

body{
    font-family: "Poppins", sans-serif;
    overflow-x: hidden;
    position: relative;
}

/* Animated gradient background */
body::before {
    content: "";
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(45deg, #6366f1, #60a5fa, #a78bfa, #f472b6);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    z-index: -1;
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Soft floating circle */
body::after {
    content: "";
    position: fixed;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    top: 30%;
    left: 70%;
    filter: blur(150px);
    z-index: -1;
    animation: floatCircle 20s ease-in-out infinite alternate;
}

@keyframes floatCircle {
    0% { transform: translateY(0px) translateX(0px); }
    50% { transform: translateY(-50px) translateX(30px); }
    100% { transform: translateY(0px) translateX(0px); }
}

/* Layout */
.layout{
    display:flex;
}

/* Sidebar */
.sidebar{
    width:260px;
    background: linear-gradient(180deg, #3b82f6, #1e40af);
    color:white;
    min-height:100vh;
    padding:25px 18px;
    box-shadow: 4px 0 15px rgba(0,0,0,0.1);
}

.brand{
    text-align:center;
    margin-bottom:30px;
    font-size:22px;
    font-weight:600;
    letter-spacing:1px;
}

.sidebar nav a{
    display:block;
    padding:12px 14px;
    margin-bottom:12px;
    border-radius:10px;
    transition:0.3s;
    color:white;
    text-decoration:none;
    font-size:15px;
}

.sidebar nav a i{
    margin-right:10px;
}

.sidebar nav a:hover,
.sidebar nav .active{
    background: rgba(255,255,255,0.2);
    transform: translateX(5px);
}

/* Main */
.main{
    flex:1;
    padding:30px 40px;
    background: rgba(255,255,255,0.85);
    border-radius: 20px;
    margin:20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.1);
}

/* Topbar */
.topbar{
    display:flex;
    justify-content:space-between;
    margin-bottom:25px;
}

.search input{
    padding:10px 14px;
    border-radius:8px;
    border:1px solid #cbd5e1;
    width:220px;
}

.profile{
    display:flex;
    align-items:center;
    gap:12px;
}

.profile img{
    border-radius:50%;
}

.logout{
    background:#ef4444;
    color:white;
    border:none;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
}

.logout:hover{
    background:#dc2626;
}

/* Title */
.page-title{
    margin-bottom:25px;
}

.page-title p{
    color:#4b5563;
}

/* Stats */
.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(10px);
    border-radius:12px;
    display:flex;
    gap:15px;
    align-items:center;
    padding:20px;
    box-shadow:0 10px 18px rgba(0,0,0,0.08);
    transition: transform 0.3s, box-shadow 0.3s;
}

.card:hover{
    transform: translateY(-10px) scale(1.02);
    box-shadow:0 20px 30px rgba(0,0,0,0.12);
}

.card i{
    font-size:28px;
    color:#2563eb;
}

.card h3{
    font-size:22px;
}

/* Table */
.table-section{
    background: rgba(255,255,255,0.95);
    padding:20px;
    border-radius:12px;
    box-shadow:0 10px 18px rgba(0,0,0,0.08);
}

.table-section h2{
    margin-bottom:15px;
}

table{
    width:100%;
    border-collapse:collapse;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

th,td{
    text-align:left;
    padding:12px;
}

thead{
    background: rgba(99,102,241,0.2);
    font-weight:600;
}

tbody tr{
    border-bottom:1px solid #eee;
}

tbody tr:hover{
    background: rgba(99,102,241,0.05);
}
</style>

</head>
<body>

<div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
        <h2 class="brand">Placement Portal</h2>
        <nav>
            <a class="active"><i class="fa fa-home"></i> Dashboard</a>
            <a href="Schedule_drives.html"><i class="fa fa-calendar"></i> Schedule Drive</a>
            <a href="verify_eligibility.html"><i class="fa fa-check"></i> Verify Eligibility</a>
            <a href="update_results.html"><i class="fa fa-bullhorn"></i> Update Results</a>
            
        </nav>
    </aside>

    <!-- Main -->
    <main class="main">

        <header class="topbar">
            <div class="search">
                <input type="text" placeholder="Search...">
            </div>

            <div class="profile">
                <span>Coordinator</span>
                <img src="https://i.pravatar.cc/40" alt="">
                <button class="logout">Logout</button>
            </div>
        </header>

        <!-- Title -->
        <div class="page-title">
            <h1>Dashboard</h1>
            <p>Monitor and manage placement activities.</p>
        </div>

        <!-- Stats -->
        <section class="stats">
            <div class="card">
                <i class="fa fa-building"></i>
                <div>
                    <h3 id="companyCount">0</h3>
                    <p>Companies</p>
                </div>
            </div>

            <div class="card">
                <i class="fa fa-calendar"></i>
                <div>
                    <h3 id="driveCount">0</h3>
                    <p>Total Drives</p>
                </div>
            </div>

            <div class="card">
                <i class="fa fa-user"></i>
                <div>
                    <h3>240</h3>
                    <p>Students</p>
                </div>
            </div>

            <div class="card">
                <i class="fa fa-trophy"></i>
                <div>
                    <h3>54</h3>
                    <p>Selected</p>
                </div>
            </div>
        </section>

        <!-- Drives -->
        <section class="table-section">
            <h2>Upcoming Drives</h2>

            <table id="driveTable">
                <thead>
                    <tr>
                        <th>Company</th>
                        <th>Role</th>
                        <th>Date</th>
                        <th>Package</th>
                    </tr>
                </thead>

                <tbody>
                </tbody>
            </table>
        </section>

    </main>
</div>

<!-- JavaScript -->
<script>
document.querySelector(".logout").addEventListener("click", function(){
    localStorage.removeItem("isLoggedIn");
    window.location.href = "home_page.html";
});

const tbody = document.querySelector("#driveTable tbody");
let drives = JSON.parse(localStorage.getItem("drives")) || [];
let companies = new Set();

drives.forEach(drive => {
    companies.add(drive.company);

    const row = document.createElement("tr");
    row.innerHTML = `
        <td>${drive.company}</td>
        <td>${drive.role}</td>
        <td>${drive.date}</td>
        <td>${drive.package} LPA</td>
    `;
    tbody.appendChild(row);
});

document.getElementById("driveCount").innerText = drives.length;
document.getElementById("companyCount").innerText = companies.size;
</script>

</body>
</html>
