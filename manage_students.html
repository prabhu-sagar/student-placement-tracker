<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manage Students</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

/* ================= BASE ================= */
* {margin:0; padding:0; box-sizing:border-box; font-family:"Poppins",sans-serif;}
body{overflow-x:hidden; position:relative; min-height:100vh;}

/* ================= BACKGROUND ================= */
body::before {
    content: "";
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: linear-gradient(45deg,#60a5fa,#93c5fd,#bfdbfe,#a5f3fc);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    z-index: -2;
}
@keyframes gradientBG {
    0% {background-position:0% 50%;}
    50% {background-position:100% 50%;}
    100% {background-position:0% 50%;}
}

/* Floating soft circle */
body::after {
    content:"";
    position: fixed;
    width:500px; height:500px;
    border-radius:50%;
    background: rgba(255,255,255,0.2);
    top:25%; left:65%;
    filter: blur(120px);
    z-index:-1;
    animation: floatCircle 20s ease-in-out infinite alternate;
}
@keyframes floatCircle {
    0%{transform:translateY(0px) translateX(0px);}
    50%{transform:translateY(-40px) translateX(20px);}
    100%{transform:translateY(0px) translateX(0px);}
}

/* ================= LAYOUT ================= */
.layout{display:flex; min-height:100vh;}
.sidebar{
    width:240px;
    background: linear-gradient(180deg,#3b82f6,#1e40af);
    color:white;
    padding:20px 15px;
    box-shadow: 4px 0 15px rgba(0,0,0,0.1);
}
.brand{text-align:center; font-size:20px; font-weight:600; margin-bottom:25px;}
.sidebar ul{list-style:none;}
.sidebar li{padding:10px;margin-bottom:10px;border-radius:8px;cursor:pointer;transition:0.3s;font-size:14px;}
.sidebar li:hover, .active{background: rgba(255,255,255,0.2);}

/* ================= MAIN ================= */
.main{
    flex:1;
    padding:25px 35px;
    background: rgba(255,255,255,0.85);
    border-radius:15px;
    margin:20px;
    box-shadow:0 12px 30px rgba(0,0,0,0.08);
}

/* ================= TOPBAR ================= */
.topbar{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-bottom:15px;
    font-size:14px;
}
.logout{
    background:#ef4444;
    color:white;
    border:none;
    padding:6px 12px;
    border-radius:6px;
    cursor:pointer;
    transition:0.3s;
    font-size:13px;
}
.logout:hover{background:#b91c1c;}
.logout i{margin-right:5px;}

/* ================= TABLE ================= */
table{
    width:100%; border-collapse:collapse; border-radius:10px; overflow:hidden; box-shadow:0 10px 25px rgba(0,0,0,0.1);
    background:white;
}
th, td{padding:12px 15px; text-align:left;}
th{background:#1e3c72; color:white;}
tr:nth-child(even){background:#f9fafb;}
tr:hover{background:#e0f2fe;}

/* ================= ACTION BUTTONS ================= */
button.action{
    padding:5px 10px; border:none; border-radius:5px; cursor:pointer; color:white;
    font-size:13px;
}
button.edit{background:#3b82f6;}
button.edit:hover{background:#2563eb;}
button.delete{background:#ef4444;}
button.delete:hover{background:#b91c1c;}
button.add{background:#10b981; margin-bottom:15px;}
button.add:hover{background:#059669;}

/* ================= MODAL ================= */
.modal{
    display:none; position:fixed; top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:100;
}
.modal-content{
    background:white; padding:25px; border-radius:12px; width:450px; max-width:90%; box-shadow:0 15px 30px rgba(0,0,0,0.2);
}
.modal-content h2{margin-bottom:15px; color:#1e3c72;}
.modal-content input{
    width:100%; padding:10px; margin-bottom:12px; border:1px solid #ccc; border-radius:6px;
}
.modal-content button{
    width:100%; padding:10px; border:none; border-radius:6px; background:#1e40af; color:white; cursor:pointer; font-size:14px;
}
.modal-content button:hover{background:#2563eb;}
</style>
</head>

<body>

<div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
        <h2 class="brand">Admin Dashboard</h2>
        <ul>
            <li onclick="location.href='admin_dashboard.html'"><i class="fa fa-home"></i> Dashboard</li>
            <li class="active"><i class="fa fa-users"></i> Manage Students</li>
            <li onclick="location.href='manage_companies.html'"><i class="fa fa-building"></i> Manage Companies</li>
            <li onclick="location.href='manage_drives.html'"><i class="fa fa-calendar"></i> Manage Drives</li>
             <li onclick="location.href='manage_coordinators.html'"><i class="fa fa-user-tie"></i> Manage Coordinators</li>
        <li onclick="location.href='reports_statistics.html'"><i class="fa fa-chart-bar"></i> Reports & Statistics</li>
        </ul>
    </aside>

    <!-- Main -->
    <main class="main">

        <!-- Topbar -->
        <div class="topbar">
            <span>Manage Students</span>
            <button class="logout" onclick="logoutAdmin()"><i class="fa fa-power-off"></i> Logout</button>
        </div>

        <!-- Add Student -->
        <button class="add" onclick="openModal('add')"><i class="fa fa-plus"></i> Add Student</button>

        <!-- Students Table -->
        <table id="studentsTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Year</th>
                    <th>SGPA</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Dynamic Rows -->
            </tbody>
        </table>

    </main>
</div>

<!-- Modal -->
<div class="modal" id="studentModal">
    <div class="modal-content">
        <h2 id="modalTitle">Add Student</h2>
        <input type="text" id="studentId" placeholder="Student ID">
        <input type="text" id="studentName" placeholder="Full Name">
        <input type="email" id="studentEmail" placeholder="Email">
        <input type="text" id="studentDept" placeholder="Department">
        <input type="number" id="studentYear" placeholder="Year">
        <input type="number" step="0.01" id="studentSGPA" placeholder="SGPA">
        <button id="saveStudentBtn">Save</button>
    </div>
</div>

<script>
let students=[
    {id:"S001", name:"John Doe", email:"john@example.com", dept:"CSE", year:3, sgpa:8.5},
    {id:"S002", name:"Jane Smith", email:"jane@example.com", dept:"ECE", year:2, sgpa:9.0},
];

function renderTable(){
    const tbody=document.querySelector("#studentsTable tbody");
    tbody.innerHTML="";
    students.forEach((s,index)=>{
        tbody.innerHTML+=`
        <tr>
            <td>${s.id}</td>
            <td>${s.name}</td>
            <td>${s.email}</td>
            <td>${s.dept}</td>
            <td>${s.year}</td>
            <td>${s.sgpa}</td>
            <td>
                <button class="action edit" onclick="openModal('edit',${index})"><i class="fa fa-edit"></i> Edit</button>
                <button class="action delete" onclick="deleteStudent(${index})"><i class="fa fa-trash"></i> Delete</button>
            </td>
        </tr>
        `;
    });
}

// Modal
let currentEditIndex=null;
function openModal(mode,index=null){
    const modal=document.getElementById("studentModal");
    modal.style.display="flex";
    currentEditIndex=index;

    if(mode==="edit"){
        document.getElementById("modalTitle").innerText="Edit Student";
        const s=students[index];
        document.getElementById("studentId").value=s.id;
        document.getElementById("studentName").value=s.name;
        document.getElementById("studentEmail").value=s.email;
        document.getElementById("studentDept").value=s.dept;
        document.getElementById("studentYear").value=s.year;
        document.getElementById("studentSGPA").value=s.sgpa;
    } else {
        document.getElementById("modalTitle").innerText="Add Student";
        document.getElementById("studentId").value="";
        document.getElementById("studentName").value="";
        document.getElementById("studentEmail").value="";
        document.getElementById("studentDept").value="";
        document.getElementById("studentYear").value="";
        document.getElementById("studentSGPA").value="";
    }
}
document.getElementById("studentModal").addEventListener("click",function(e){
    if(e.target===this) this.style.display="none";
});

// Save
document.getElementById("saveStudentBtn").addEventListener("click",function(){
    const id=document.getElementById("studentId").value.trim();
    const name=document.getElementById("studentName").value.trim();
    const email=document.getElementById("studentEmail").value.trim();
    const dept=document.getElementById("studentDept").value.trim();
    const year=parseInt(document.getElementById("studentYear").value);
    const sgpa=parseFloat(document.getElementById("studentSGPA").value);

    if(!id || !name || !email || !dept || !year || isNaN(sgpa)){
        alert("Fill all fields correctly.");
        return;
    }

    if(currentEditIndex!==null){
        students[currentEditIndex]={id,name,email,dept,year,sgpa};
    } else {
        students.push({id,name,email,dept,year,sgpa});
    }

    document.getElementById("studentModal").style.display="none";
    renderTable();
});

// Delete
function deleteStudent(index){
    if(confirm(`Delete ${students[index].name}?`)){
        students.splice(index,1);
        renderTable();
    }
}

// Logout
function logoutAdmin(){
    localStorage.removeItem("isAdminLoggedIn");
    window.location.href="Admin_login.html";
}

// Init
window.onload=function(){
    if(localStorage.getItem("isAdminLoggedIn")!=="true"){
        window.location.href="Admin_login.html";
    }
    renderTable();
};
</script>
</body>
</html>
