<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Register</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    overflow-y:auto;
}

/* Background Video */
video{
    position:fixed;
    top:0;
    left:0;
    min-width:100%;
    min-height:100%;
    object-fit:cover;
    z-index:-2;
}

/* Dark overlay */
body::after{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.45);
    z-index:-1;
}

/* HEADER */
.header{
    position:fixed;
    top:0;
    width:100%;
    height:65px;
    background:#f2f2f2;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 50px;
    z-index:10;
}

.logo-text{
    font-size:22px;
    font-weight:bold;
    color:#6a1b9a;
}

.main{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding-top:90px;
    padding-bottom:60px;
}

.register-card{
    width:700px;
    background:rgba(255,255,255,0.95);
    padding:35px;
    border-radius:15px;
    box-shadow:0 15px 35px rgba(0,0,0,0.5);
}

.register-header{
    text-align:center;
    margin-bottom:25px;
}

.register-header h2{
    color:#355c9b;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.input-group{
    display:flex;
    flex-direction:column;
}

.input-group label{
    font-weight:600;
    margin-bottom:6px;
}

.input-group input,
.input-group select{
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
}

.full-width{
    grid-column:1 / 3;
}

.register-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    color:white;
    background:linear-gradient(135deg,#6a1b9a,#355c9b);
    cursor:pointer;
}

.register-btn:hover{
    transform:scale(1.03);
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
    <source src="student.mp4" type="video/mp4">
</video>

<div class="header">
    <div class="logo-text">🎓 Student Placement Tracker</div>
</div>

<main class="main">
<div class="register-card">

<div class="register-header">
    <h2>Student Registration</h2>
</div>

<form id="registerForm">
<div class="form-grid">

<div class="input-group">
    <label>Student ID</label>
    <input type="text" id="studentId" required>
</div>

<div class="input-group">
    <label>Full Name</label>
    <input type="text" id="name" required>
</div>

<div class="input-group">
    <label>Email</label>
    <input type="email" id="email" required>
</div>

<div class="input-group">
    <label>Phone</label>
    <input type="tel" id="phone" required>
</div>

<div class="input-group">
    <label>Department</label>
    <select id="department" required>
        <option value="">Select</option>
        <option>CSE</option>
        <option>ECE</option>
        <option>EEE</option>
        <option>MECH</option>
        <option>CIVIL</option>
    </select>
</div>

<div class="input-group">
    <label>Year</label>
    <select id="year" required>
        <option value="">Select</option>
        <option>1st Year</option>
        <option>2nd Year</option>
        <option>3rd Year</option>
        <option>4th Year</option>
    </select>
</div>

<!-- 🔥 NEW CGPA FIELD -->
<div class="input-group">
    <label>CGPA</label>
    <input type="number" id="cgpa" step="0.01" min="0" max="10" required>
</div>

<div class="input-group">
    <label>Password</label>
    <input type="password" id="password" required>
</div>

<div class="input-group">
    <label>Confirm Password</label>
    <input type="password" id="confirmPassword" required>
</div>

<div class="input-group full-width">
    <button type="submit" class="register-btn">Register</button>
</div>

</div>
</form>

</div>
</main>

<script>
document.getElementById("registerForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if(password !== confirmPassword){
        alert("Passwords do not match");
        return;
    }

    const studentData = {
        studentId: document.getElementById("studentId").value,
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        department: document.getElementById("department").value,
        year: document.getElementById("year").value,
        cgpa: document.getElementById("cgpa").value,
        password: password
    };

    try {

        const response = await fetch("http://localhost:5000/student_register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(studentData)
        });

        const result = await response.json();

        if(result.success){
            alert("Registration Successful!");
            window.location.href = "student_login.html";
        } else {
            alert(result.message || "Registration Failed");
        }

    } catch (error) {
        console.error("Error:", error);
        alert("Server Error");
    }

});
</script>
</body>
</html>
