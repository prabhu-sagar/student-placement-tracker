<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
}

/* 🎥 Background Video */
video{
    position:fixed;
    top:0;
    left:0;
    min-width:100%;
    min-height:100%;
    object-fit:cover;
    z-index:-2;
}

/* Dark Overlay */
body::after{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.4);
    z-index:-1;
}

/* ================= HEADER ================= */

.header{
    position:fixed;
    top:0;
    width:100%;
    height:60px;
    background:#e9e9e9;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 40px;
    z-index:10;
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:#6a1b9a;
}

.nav-links a{
    margin-left:30px;
    text-decoration:none;
    color:#333;
    font-weight:500;
    font-size:16px;
}

.nav-links a:hover{
    color:#6a1b9a;
}

/* ================= LOGIN ================= */

.main{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-section{
    width:360px;
    padding:35px;
    background:rgba(255,255,255,0.95);
    border-radius:10px;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
    text-align:center;
}

.user-img img{
    width:90px;
    margin-bottom:15px;
}

.login-section h2{
    margin-bottom:20px;
    color:#355c9b;
}

.input-box{
    margin-bottom:15px;
    text-align:left;
}

.input-box label{
    font-weight:bold;
    display:block;
    margin-bottom:5px;
}

.input-box input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

.forgot{
    text-align:right;
    margin-bottom:15px;
}

.forgot a{
    text-decoration:none;
    color:#355c9b;
    font-size:14px;
}

.btn{
    width:100%;
    padding:12px;
    background:#355c9b;
    border:none;
    color:white;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
}

.btn:hover{
    background:#274472;
}

/* ================= FOOTER ================= */

.footer{
    position:fixed;
    bottom:0;
    width:100%;
    height:50px;
    background:#e9e9e9;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 40px;
    font-size:14px;
}

.footer-center{
    font-weight:500;
}

.footer a{
    margin-left:15px;
    text-decoration:none;
    color:#355c9b;
}

.footer a:hover{
    text-decoration:underline;
}
</style>
</head>

<body>

<!-- Background Video -->
<video autoplay muted loop playsinline>
    <source src="student.mp4" type="video/mp4">
</video>

<!-- ================= HEADER ================= -->
<div class="header">
    <div class="logo">🎓 Student Placement Tracker</div>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="statistics.html">Statistics</a>
        <a href="companies.html">Companies</a>
    </div>
</div>

<!-- ================= LOGIN ================= -->
<main class="main">
  <div class="login-section">

    <div class="user-img">
      <img src="https://cdn-icons-png.flaticon.com/512/3135/3135789.png" alt="student">
    </div>

    <h2>Student Login</h2>

    <form id="loginForm">

      <div class="input-box">
        <label>Student ID</label>
        <input type="text" id="studentId" placeholder="Enter Student ID" required>
      </div>

      <div class="input-box">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter Password" required>
      </div>

      <div class="forgot">
        <a href="#">Forgot Password?</a>
      </div>

      <button type="submit" class="btn">Login</button>
     
      <p style="margin-top:15px;">
          Don't have account?
         <a href="student_register.html" style="color:#355c9b;">Register Here</a>
      </p>
    </form>

  </div>
</main>

<!-- ================= FOOTER ================= -->
<div class="footer">
    <div>© 2026 Student Placement Tracker</div>
    <div class="footer-center">Developed for Campus Recruitment System</div>
    <div>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </div>
</div>

<!-- ================= JS ================= -->
<!-- ================= JS ================= -->
<script>
document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();

    const studentId = document.getElementById("studentId").value.trim();
    const password = document.getElementById("password").value.trim();

    // Get all registered students
    let students = JSON.parse(localStorage.getItem("students")) || [];

    console.log("All Registered Students:", students); // Debug

    // Find matching student
    let student = students.find(function(s){
        return s.studentId === studentId && s.password === password;
    });

    if(student){

        console.log("Logged In Student:", student); // Debug
        console.log("CGPA Value:", student.cgpa);   // Debug

        // IMPORTANT: Store full object (including CGPA)
        localStorage.setItem("loggedInStudent", JSON.stringify(student));

        alert("Login Successful!");

        window.location.href = "student_dashboard.html";

    } else {
        alert("Invalid Student ID or Password");
    }
});
</script>

</body>

</html>
