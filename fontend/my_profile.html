<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Profile</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    display:flex;
    min-height:100vh;
    background: linear-gradient(
        90deg,
        #3b82f6 0%,
        #6366f1 50%,
        #a855f7 100%
    );
}

/* SIDEBAR */
.sidebar{
    width:260px;
    background: linear-gradient(180deg,#3b82f6,#1e40af);
    padding:30px 20px;
    color:white;
}

.sidebar h2{
    margin-bottom:30px;
}

.sidebar ul{
    list-style:none;
}

.sidebar ul li{
    margin-bottom:10px;
}

.sidebar ul li a{
    text-decoration:none;
    color:white;
    padding:12px;
    display:flex;
    align-items:center;
    gap:12px;
    border-radius:10px;
    transition:0.3s;
}

.sidebar ul li a:hover{
    background:rgba(255,255,255,0.2);
}

.sidebar ul li a.active{
    background:rgba(255,255,255,0.3);
}

/* MAIN (same as dashboard) */
.main{
    flex:1;
    margin:20px;
    padding:30px;
    background:#e5e7eb;
    border-radius:30px;
    box-shadow:0 10px 40px rgba(0,0,0,0.15);
}

.header{
    margin-bottom:25px;
}

.header h1{
    color:#2c4a7c;
}

/* FORM SECTION (same card style as dashboard section) */
.form-container{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group label{
    margin-bottom:5px;
    font-weight:600;
    color:#2c4a7c;
}

.form-group input,
.form-group select,
.form-group textarea{
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
    background:#f4f6fa;
}

textarea{
    resize:none;
}

.full-width{
    grid-column:span 2;
}

button{
    margin-top:20px;
    padding:10px 16px;
    background:#3f7ad6;
    border:none;
    color:white;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#2f6fd1;
}

/* Keep Choose File visible */
input[type="file"]{
    background:#f4f6fa;
    padding:6px;
}

</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <h2>Student Panel</h2>
    <ul>
        <li><a href="student_dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
        <li><a href="my_profile.html" class="active"><i class="fas fa-user"></i> My Profile</a></li>
        <li><a href="available_drives.html"><i class="fas fa-calendar-alt"></i> Available Drives</a></li>
        <li><a href="applied_drives.html"><i class="fas fa-file-alt"></i> Applied Drives</a></li>
    </ul>
</div>

<!-- Main Content -->
<div class="main">

    <div class="header">
        <h1>My Profile</h1>
        <p>Update your personal and academic details</p>
    </div>

    <div class="form-container">

        <form>

            <div class="form-grid">

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your name">
                </div>

                <div class="form-group">
                    <label>Student ID</label>
                    <input type="text" placeholder="Enter ID">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="Enter email">
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" placeholder="Enter phone number">
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <select>
                        <option>Select</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date">
                </div>

                <div class="form-group">
                    <label>Department</label>
                    <input type="text" placeholder="CSE / ECE / etc">
                </div>

                <div class="form-group">
                    <label>Year</label>
                    <select>
                        <option>1st Year</option>
                        <option>2nd Year</option>
                        <option>3rd Year</option>
                        <option>4th Year</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>CGPA</label>
                    <input type="number" step="0.01">
                </div>

                <div class="form-group">
                    <label>10th Percentage</label>
                    <input type="number">
                </div>

                <div class="form-group">
                    <label>12th / Diploma Percentage</label>
                    <input type="number">
                </div>

                <div class="form-group">
                    <label>Backlogs</label>
                    <input type="number">
                </div>

                <div class="form-group full-width">
                    <label>Skills</label>
                    <textarea rows="3" placeholder="Java, Python, Web Development..."></textarea>
                </div>

                <div class="form-group full-width">
                    <label>LinkedIn Profile</label>
                    <input type="url" placeholder="https://linkedin.com/...">
                </div>

                <div class="form-group full-width">
                    <label>GitHub Profile</label>
                    <input type="url" placeholder="https://github.com/...">
                </div>

                <div class="form-group full-width">
                    <label>Upload Resume</label>
                    <input type="file">
                </div>

            </div>

            <button type="submit">Save Profile</button>

        </form>

    </div>

</div>

</body>
</html>
