<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Applied Drives</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    display:flex;
    min-height:100vh;
    background: linear-gradient(
        90deg,
        #3b82f6 0%,
        #6366f1 50%,
        #a855f7 100%
    );
}

/* SIDEBAR */
.sidebar{
    width:260px;
    background: linear-gradient(180deg,#3b82f6,#1e40af);
    padding:30px 20px;
    color:white;
}

.sidebar h2{
    margin-bottom:30px;
}

.sidebar ul{
    list-style:none;
}

.sidebar ul li{
    margin-bottom:10px;
}

.sidebar ul li a{
    text-decoration:none;
    color:white;
    padding:12px;
    display:flex;
    align-items:center;
    gap:12px;
    border-radius:10px;
    transition:0.3s;
}

.sidebar ul li a:hover{
    background:rgba(255,255,255,0.2);
}

.sidebar ul li a.active{
    background:rgba(255,255,255,0.3);
}

/* MAIN */
.main{
    flex:1;
    margin:20px;
    padding:30px;
    background:#e5e7eb;
    border-radius:30px;
    box-shadow:0 10px 40px rgba(0,0,0,0.15);
}

.header{
    margin-bottom:30px;
}

.header h1{
    color:#2c4a7c;
}

.header p{
    color:#555;
}

/* DRIVE CARDS */
.drive-container{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:20px;
}

.drive-card{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 6px 15px rgba(0,0,0,0.1);
    transition:0.3s;
}

.drive-card:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

.drive-card h3{
    color:#2c4a7c;
    margin-bottom:10px;
}

.drive-card p{
    margin-bottom:8px;
    color:#555;
    font-size:14px;
}

.status{
    display:inline-block;
    padding:6px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
    background:#d1fae5;
    color:#065f46;
    margin-top:8px;
}

.empty{
    text-align:center;
    padding:50px;
    color:#777;
    font-size:18px;
}
</style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <h2>Student Panel</h2>
    <ul>
        <li><a href="student_dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
        <li><a href="my_profile.html"><i class="fas fa-user"></i> My Profile</a></li>
        <li><a href="available_drives.html"><i class="fas fa-calendar-alt"></i> Available Drives</a></li>
        <li><a href="applied_drives.html" class="active"><i class="fas fa-file-alt"></i> Applied Drives</a></li>
    </ul>
</div>

<!-- Main Content -->
<div class="main">

    <div class="header">
        <h1>Applied Drives</h1>
        <p>Track the companies you have applied for</p>
    </div>

    <div class="drive-container" id="appliedList"></div>

</div>

<script>

// Get applied drives
let appliedDrives = JSON.parse(localStorage.getItem("appliedDrives")) || [];
let container = document.getElementById("appliedList");

if(appliedDrives.length === 0){
    container.innerHTML = `
        <div class="empty">
            <i class="fas fa-folder-open fa-2x"></i>
            <p>No drives applied yet.</p>
        </div>
    `;
} else {
    appliedDrives.forEach(drive => {

        container.innerHTML += `
            <div class="drive-card">
                <h3>${drive.company}</h3>
                <p><strong>Role:</strong> ${drive.role}</p>
                <p><strong>Package:</strong> ${drive.package}</p>
                <p><strong>Applied On:</strong> ${drive.date}</p>
                <span class="status">Application Submitted</span>
            </div>
        `;
    });
}

</script>

</body>
</html>
